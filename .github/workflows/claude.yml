name: Claude Code

# Responds to `@claude` mentions. Logic lives in rsanheim/infra.
# See infra/.github/workflows/README.md.
#
# This repo is summons-only by design: no automatic PR reviewer.

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

jobs:
  claude:
    uses: rsanheim/infra/.github/workflows/claude.yml@main
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
      actions: read
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
