# Commands run relative to this config's directory. The fixed workload isolates
# Plur's notification overhead; plain RSpec is the control for Ruby/host drift.
benchmarks:
  - name: "rspec-notifications@20000 -n 1"
    exec: plur -C fixtures/rspec-notifications --use rspec -n 1
    options: { warmup-time: "2s", min-rounds: 5, max-rounds: 5 }

  - name: "rspec-notifications@20000 rspec"
    exec: bash -c "cd fixtures/rspec-notifications && exec bundle exec rspec --format progress"
    options: { warmup-time: "2s", min-rounds: 5, max-rounds: 5 }
