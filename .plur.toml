[job.build]
cmd = ["bin/rake", "install"]

[job.rspec]
cmd = ["bin/rspec"]

# Go source files -> test their package
[[watch]]
name = "go-source"
source = "**/*.go"
targets = ["./{{dir_relative}}"]
jobs = ["go-test"]
ignore = ["**/*_test.go", "vendor/**", "**/vendor/**", "**/testdata/**"]

# Go test files -> run tests
[[watch]]
name = "go-tests"
source = "**/*_test.go"
targets = ["./{{dir_relative}}"]
jobs = ["go-test"]
ignore = ["vendor/**", "**/vendor/**", "**/testdata/**"]
