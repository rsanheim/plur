site_name: Plur
site_description: Fast parallel test runner for Ruby, with RSpec and Minitest support
site_url: https://plur.run/
repo_name: rsanheim/plur
repo_url: https://github.com/rsanheim/plur
edit_uri: edit/main/docs/

theme:
  name: material
  variant: classic
  icon:
    logo: simple/unity
  font:
    text: Lato
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.prefetch
    - navigation.sections
    - navigation.indexes
    - navigation.path
    - navigation.footer
    - navigation.top
    - navigation.tracking
    - toc.follow
    - search.highlight
    - content.action.edit
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tasklist:
      custom_checkbox: true
      clickable_checkbox: false
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html

exclude_docs: |
  .DS_Store

# Navigation handled by awesome-nav (docs/.nav.yml)

plugins:
  - search
  - awesome-nav
  - privacy:
      cache_dir: !ENV [PLUR_DOCS_PRIVACY_CACHE_DIR, .cache/plugin/privacy]
      assets_exclude:
        - cdn.plyr.io/*
        - imasdk.googleapis.com/*
        - pagead2.googlesyndication.com/*
        - player.vimeo.com/*
        - s0.2mdn.net/*
        - unpkg.com/ace-builds*
        - unpkg.com/glightbox*
        - unpkg.com/pyodide*

validation:
  nav:
    omitted_files: info
    not_found: warn
    absolute_links: info
  links:
    not_found: warn
    anchors: warn
    absolute_links: info
    unrecognized_links: info

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/rsanheim/plur

extra_css:
  - stylesheets/extra.css
