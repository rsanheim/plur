version: 2.1

parameters:
  go_version:
    type: string
    default: "1.27.0"
  ruby_version:
    type: string
    default: "4.0.6"

orbs:
  ruby: circleci/ruby@2.6.0
  go: circleci/go@3.0.3

jobs:
  build-and-test-go:
    docker:
      - image: cimg/ruby:<< pipeline.parameters.ruby_version >>
    working_directory: ~/project
    resource_class: medium
    environment:
      - VERBOSE=true
    steps:
      - checkout
      - go/install:
          version: << pipeline.parameters.go_version >>
      - go/mod-download-cached
      - go/load-build-cache
      # Gems live outside the repo: goreleaser's `go mod vendor` before-hook
      # rewrites ./vendor, which would wipe the orb's default vendor/bundle.
      - ruby/install-deps:
          key: "plur-v3"
          include-branch-in-cache-key: false
          path: /home/circleci/bundle
      - run:
          name: Install shellcheck
          command: sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
      - run:
          name: Install Go lint tools (versions from .mise.toml)
          command: |
            gobin="$(go env GOPATH)/bin"
            echo "export PATH=\"${gobin}:\$PATH\"" >> "$BASH_ENV"
            version="$(sed -n 's/^golangci-lint = "\(.*\)"$/\1/p' .mise.toml)"
            curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b "$gobin" "v${version}"
            go install golang.org/x/vuln/cmd/govulncheck@latest
      - run:
          name: Build plur
          command: bin/rake build lint
      - run:
          name: Verify plur binary
          command: |
            ./plur --version
            ./plur --help
            ./plur doctor
      - run:
          name: Run Go tests
          command: bin/rake test:go
      - go/save-build-cache

  test-goreleaser:
    docker:
      - image: cimg/go:<< pipeline.parameters.go_version >>
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - go/mod-download-cached
      - go/load-build-cache
      - go/install-goreleaser
      - run:
          name: Verify GoReleaser installation
          command: goreleaser --version
      - run:
          name: Test GoReleaser snapshot build
          command: |
            goreleaser build --snapshot --clean
      - run:
          name: Test Linux binary
          command: |
            arch="$(go env GOARCH)"
            if [ "$arch" = "arm64" ]; then
              bin="dist/plur_linux_arm64_v8.0/plur"
            else
              bin="dist/plur_linux_${arch}_v1/plur"
            fi
            if [ ! -x "$bin" ]; then
              echo "Expected binary not found: $bin"
              echo "Available plur binaries:"
              find dist -maxdepth 3 -type f -name plur -print
              exit 1
            fi
            "$bin" --version
            "$bin" doctor
      - store_artifacts:
          path: dist
          destination: goreleaser-artifacts
      - go/save-build-cache

  test-go-race:
    docker:
      - image: cimg/go:<< pipeline.parameters.go_version >>
    resource_class: medium
    working_directory: ~/project
    steps:
      - checkout
      - go/mod-download-cached
      - go/load-build-cache
      - run:
          name: Run Go tests with race detection
          command: go test -mod=mod -race -short ./...
      - go/save-build-cache

  test-ruby-integration:
    docker:
      - image: cimg/ruby:<< pipeline.parameters.ruby_version >>
    resource_class: medium+
    working_directory: ~/project/
    steps:
      - checkout
      - go/install:
          version: << pipeline.parameters.go_version >>
      - go/mod-download-cached
      - go/load-build-cache
      - go/install-goreleaser
      - run:
          name: Add GOPATH/bin to PATH
          command: echo 'export PATH="$HOME/go/bin:$PATH"' >> "$BASH_ENV"
      - run:
          name: Install tmux
          command: sudo apt-get update -qq && sudo apt-get install -y -qq tmux
      # Gems live outside the repo: goreleaser's `go mod vendor` before-hook
      # rewrites ./vendor, which would wipe the orb's default vendor/bundle.
      - ruby/install-deps:
          key: "plur-v3"
          include-branch-in-cache-key: false
          path: /home/circleci/bundle
      - run:
          name: Install plur globally
          command: bin/rake install
      - run:
          name: Install plur watcher
          command: plur watch install
      - run:
          name: plur doctor
          command: |
            which plur
            plur doctor
      - run:
          name: Run Ruby tests with plur
          command: |
            bin/rake test:default_ruby
      - restore_cache:
          keys:
            - v1-fixture-rails-{{ checksum "fixtures/projects/default-rails/Gemfile.lock" }}
            - v1-fixture-rails-
      - run:
          name: Setup test_app
          working_directory: fixtures/projects/default-rails
          command: |
            bundle config set --local path vendor/bundle
            bundle install
            bundle exec rake db:create db:migrate
      - save_cache:
          key:
            v1-fixture-rails-{{ checksum "fixtures/projects/default-rails/Gemfile.lock"
            }}
          paths:
            - fixtures/projects/default-rails/vendor/bundle
      - run:
          name: Run test_app specs with plur
          working_directory: fixtures/projects/default-rails
          command: plur
      - run:
          name: Run all Ruby specs
          command: |
            bin/rake test
      - go/save-build-cache

workflows:
  test-all:
    jobs:
      - build-and-test-go
      - test-goreleaser
      - test-go-race
      - test-ruby-integration
