# Uses Plur's mise-driven toolchain image, `plur/ci` in Zot, built from
# `ci/images/ci.Containerfile` and published by ci-images.yaml.
when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

labels:
  platform: linux/amd64

variables:
  - &plur_image 'registry.shark-tet.ts.net/plur/ci:2026-11-11-9ba56568'

clone:
  - name: git
    image: registry.shark-tet.ts.net/infra/clone:2026-09-30-dbd7093e
    settings:
      cache_path: /cache/repos/github.com/rsanheim/plur.git
      cache_refresh: true

steps:
  # Docs-only changes skip the heavy step below, so the strict docs build runs
  # on its own here. `bin/rake` covers the same check via lint:docs.
  - name: docs
    image: *plur_image
    environment:
      UV_CACHE_DIR: /cache/plur/uv
      PLUR_DOCS_PRIVACY_CACHE_DIR: /cache/plur/docs-privacy
    when:
      - path:
          include:
            - 'docs/**'
            - mkdocs.yml
            - pyproject.toml
    commands:
      - mkdir -p "$UV_CACHE_DIR" "$PLUR_DOCS_PRIVACY_CACHE_DIR"
      - uv run zensical build --strict

  - name: ci
    image: *plur_image
    environment:
      CI: 'true'
      BUNDLE_JOBS: '4'
      BUNDLE_RETRY: '3'
      BUNDLE_PATH: /cache/plur/bundle
      GOPATH: /cache/plur/go
      GOCACHE: /cache/plur/go-build
      XDG_CACHE_HOME: /cache/plur/xdg
      UV_CACHE_DIR: /cache/plur/uv
      PLUR_DOCS_PRIVACY_CACHE_DIR: /cache/plur/docs-privacy
      PLUR_WORKERS: '4'
    when:
      - path:
          exclude: ['**/*.md']
    commands:
      - |
        set -e

        mkdir -p "$BUNDLE_PATH" "$GOPATH/bin" "$GOCACHE" "$XDG_CACHE_HOME" "$UV_CACHE_DIR" "$PLUR_DOCS_PRIVACY_CACHE_DIR"
        # Install into mise's Go bin directory and prefer it over cached binaries.
        GOBIN="$(mise where go)/bin"
        export GOBIN
        export PATH="$GOBIN:/opt/mise/shims:$GOPATH/bin:/usr/local/bin:$PATH"

        # Keep plur's test timings on /cache so each run balances workers with
        # the previous run's data instead of by file size.
        mkdir -p /cache/plur/plur-runtime "$HOME/.plur"
        ln -s /cache/plur/plur-runtime "$HOME/.plur/runtime"

        go version
        ruby --version
        goreleaser --version
        sqlite3 --version
        tmux -V
        uv --version

        bundle install --jobs "$BUNDLE_JOBS" --retry "$BUNDLE_RETRY"

        bin/rake

  # Keeps the workflow green when the work above is skipped on a docs-only change.
  - name: docs-only-passthrough
    image: *plur_image
    commands:
      - 'echo "docs-only change: heavy work skipped, keeping this workflow green"'
