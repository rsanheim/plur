# Uses Plur's mise-driven toolchain image, `plur/ci` in Zot, built from
# `ci/images/ci.Containerfile` and published by ci-images.yaml.
when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}
  - event: manual

labels:
  platform: linux/amd64

variables:
  - &plur_image 'registry.shark-tet.ts.net/plur/ci:2026-11-11-9ba56568'

clone:
  - name: git
    image: registry.shark-tet.ts.net/infra/clone:2026-09-30-dbd7093e
    settings:
      cache_path: /cache/repos/github.com/rsanheim/plur.git
      cache_refresh: true

cache:
  - key: 'plur-runtime-v1-{{ checksum "spec/**/*_spec.rb" }}'
    restore_keys: ['plur-runtime-v1-']
    paths: [tmp/plur-runtime]
  - key: 'gems-v1-{{ arch }}-{{ checksum ".mise.toml" "Gemfile.lock" "fixtures/projects/*/Gemfile.lock" }}'
    restore_keys: ['gems-v1-{{ arch }}-']
    paths: [tmp/bundle, tmp/fixture-bundles]
  - key: 'go-v1-{{ arch }}-{{ checksum ".mise.toml" "go.sum" }}'
    restore_keys: ['go-v1-{{ arch }}-']
    paths: [tmp/go, tmp/go-build, tmp/xdg]
  - key: 'docs-v1-{{ arch }}-{{ checksum "uv.lock" "mkdocs.yml" }}'
    restore_keys: ['docs-v1-{{ arch }}-']
    paths: [tmp/uv, tmp/docs-privacy]

steps:
  # Docs-only changes skip the heavy step below, so the strict docs build runs
  # on its own here. `bin/rake` covers the same check via lint:docs.
  - name: docs
    image: *plur_image
    environment:
      UV_CACHE_DIR: ${CI_WORKSPACE}/tmp/uv
      PLUR_DOCS_PRIVACY_CACHE_DIR: ${CI_WORKSPACE}/tmp/docs-privacy
    when:
      - path:
          include:
            - 'docs/**'
            - mkdocs.yml
            - pyproject.toml
    commands:
      - mkdir -p "$UV_CACHE_DIR" "$PLUR_DOCS_PRIVACY_CACHE_DIR"
      - uv run zensical build --strict

  - name: ci
    image: *plur_image
    environment:
      CI: 'true'
      BUNDLE_JOBS: '4'
      BUNDLE_RETRY: '3'
      BUNDLE_PATH: ${CI_WORKSPACE}/tmp/bundle
      GOPATH: ${CI_WORKSPACE}/tmp/go
      GOCACHE: ${CI_WORKSPACE}/tmp/go-build
      XDG_CACHE_HOME: ${CI_WORKSPACE}/tmp/xdg
      UV_CACHE_DIR: ${CI_WORKSPACE}/tmp/uv
      PLUR_DOCS_PRIVACY_CACHE_DIR: ${CI_WORKSPACE}/tmp/docs-privacy
      PLUR_WORKERS: '4'
    when:
      - path:
          exclude: ['**/*.md']
    commands:
      - |
        set -e

        mkdir -p "$BUNDLE_PATH" "$GOPATH/bin" "$GOCACHE" "$XDG_CACHE_HOME" "$UV_CACHE_DIR" "$PLUR_DOCS_PRIVACY_CACHE_DIR"
        # Install into mise's Go bin directory and prefer it over cached binaries.
        GOBIN="$(mise where go)/bin"
        export GOBIN
        export PATH="$GOBIN:/opt/mise/shims:$GOPATH/bin:/usr/local/bin:$PATH"

        mkdir -p tmp/plur-runtime "$HOME/.plur"
        ln -s "$PWD/tmp/plur-runtime" "$HOME/.plur/runtime"

        go version
        ruby --version
        goreleaser --version
        sqlite3 --version
        tmux -V
        uv --version

        bundle install --jobs "$BUNDLE_JOBS" --retry "$BUNDLE_RETRY"

        script/bundle-fixtures "$PWD/tmp/fixture-bundles"

        bin/rake

  # Keeps the workflow green when the work above is skipped on a docs-only change.
  - name: docs-only-passthrough
    image: *plur_image
    commands:
      - 'echo "docs-only change: heavy work skipped, keeping this workflow green"'
