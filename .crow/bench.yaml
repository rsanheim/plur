# Plur recurring benchmarks. Runs script/bench-suite over benchmarks/projects.yml,
# writing results to the dedicated ci-bench:/bench volume.
when:
  - event: cron
    cron: nightly-bench
  - event: manual
  - event: push
    evaluate: >-
      CI_COMMIT_MESSAGE contains "[bench]" &&
      CI_REPO == "rsanheim/plur" &&
      CI_PIPELINE_AUTHOR == "rsanheim"

labels:
  platform: linux/amd64

variables:
  - &plur_image 'registry.shark-tet.ts.net/plur/ci:2026-11-19-17a1a052'

cache:
  - key: 'bench-gems-v1-{{ arch }}-{{ checksum ".mise.toml" "Gemfile.lock" }}'
    restore_keys: ['bench-gems-v1-{{ arch }}-']
    paths: [vendor/bundle]
  - key: 'bench-go-v1-{{ arch }}-{{ checksum ".mise.toml" "go.sum" }}'
    restore_keys: ['bench-go-v1-{{ arch }}-']
    paths: [.cache/go-build]

steps:
  - name: bench
    image: *plur_image
    volumes:
      - ci-bench:/bench
    environment:
      CI: "true"
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      BUNDLE_PATH: ${CI_WORKSPACE}/vendor/bundle
      XDG_CACHE_HOME: ${CI_WORKSPACE}/.cache
      # dedicated benchmark volume: targets + results live here, not in the build cache
      BENCH_ROOT: /bench/plur
      BENCH_HOST: minibox
      BENCH_CONTAINER_IMAGE: *plur_image
      # renovate: datasource=github-releases depName=sharkdp/hyperfine
      HYPERFINE_VERSION: 1.19.0
    commands:
      - |
        set -e

        tool_tmp="$PWD/tmp/bench-tools"
        mkdir -p "$BENCH_ROOT" "$tool_tmp"
        # Install into mise's Go bin directory.
        GOBIN="$(mise where go)/bin"
        export GOBIN
        export PATH="$GOBIN:/opt/mise/shims:/usr/local/bin:$PATH"

        go version
        ruby --version
        goreleaser --version

        # hyperfine drives the benchmarks and is not baked into the image; this
        # is the static musl build (no glibc dependency).
        hf="hyperfine-v$HYPERFINE_VERSION-x86_64-unknown-linux-musl"
        curl -fsSL "https://github.com/sharkdp/hyperfine/releases/download/v$HYPERFINE_VERSION/$hf.tar.gz" -o "$tool_tmp/hyperfine.tar.gz"
        tar -xzf "$tool_tmp/hyperfine.tar.gz" -C "$tool_tmp"
        install "$tool_tmp/$hf/hyperfine" /usr/local/bin/hyperfine
        rm -rf "$tool_tmp/hyperfine.tar.gz" "$tool_tmp/$hf"
        hyperfine --version

        bundle install --jobs "$BUNDLE_JOBS" --retry "$BUNDLE_RETRY"
        bin/rake vendor:download:current
        bin/rake install

        # The suite runs as a non-root user: rubocop + rack have specs that fail under root (root bypasses the permission checks they test). 
        id -u bench >/dev/null 2>&1 || useradd --create-home --shell /bin/bash bench
        # It writes only to tmp/ and the benchmark volume, and git requires it to
        # own the checkout it reads. The cached build paths stay root-owned.
        chown bench:bench "$PWD" "$PWD/.git"
        chown -R bench:bench "$PWD/tmp" "$BENCH_ROOT"

        # XDG_CACHE_HOME is for the root-owned build caches above; it must not
        # leak into the benchmarked suites (rubocop has specs asserting the
        # default cache dir in $HOME). The bench user gets stock XDG defaults.
        # Trigger label is the Crow event (cron/manual/push), set as a step env var.
        runuser -u bench -- env -u XDG_CACHE_HOME PATH="$PATH" HOME=/home/bench CI=true BENCH_HOST="$BENCH_HOST" script/bench-suite --manifest benchmarks/projects.yml --out "$BENCH_ROOT" --trigger "$CI_PIPELINE_EVENT"
