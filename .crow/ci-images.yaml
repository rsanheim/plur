# Build Plur's CI image with script/build
labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: publish
    image: quay.io/buildah/stable:v1.43.4-immutable
    environment:
      STORAGE_DRIVER: vfs
    when:
      - path:
          include:
            - .mise.toml
            - ci/images/*.Containerfile
            - script/build
            - .crow/ci-images.yaml
          on_empty: false
    commands:
      - |-
        tag="$(date -u +%Y-%m-%d)-$(git rev-parse --short=8 HEAD)"
        script/build "$tag" --push
