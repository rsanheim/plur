# Build Plur's CI image with script/build in the official Buildah image and
# publish it to Zot under one immutable YYYY-MM-DD-<shortsha> tag. Publication
# is automatic: a pull request or default-branch push that changes an image
# input publishes that revision's tag. Publishing is not validation; ci and
# bench prove an image once a commit adopts its tag, and nothing depends on
# this workflow.
# Requires the repo Security (privileged) flag.
labels:
  platform: linux/amd64

when:
  - event: pull_request
  - event: push
    branch: ${CI_REPO_DEFAULT_BRANCH}

steps:
  - name: publish
    image: quay.io/buildah/stable:v1.43.4-immutable
    privileged: true
    when:
      - path:
          include:
            - .mise.toml
            - ci/images/*.Containerfile
            - script/build
            - .crow/ci-images.yaml
          on_empty: false
    commands:
      - |-
        tag="$(date -u +%Y-%m-%d)-$(git rev-parse --short=8 HEAD)"
        script/build "$tag" --push
