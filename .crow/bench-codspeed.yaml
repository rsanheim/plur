# CodSpeed walltime benchmarks: provision the benchmarks/projects.yml targets,
# run benchmarks/codspeed.yml over them, and upload the results to CodSpeed.
when:
  - event: cron
    cron: nightly-codspeed
  - event: manual
  # Opt-in: "[codspeed]" in the commit message runs CodSpeed for that push, once.
  - event: push
    evaluate: >-
      CI_COMMIT_MESSAGE contains "[codspeed]" &&
      CI_REPO == "rsanheim/plur" &&
      CI_PIPELINE_AUTHOR == "rsanheim"

labels:
  platform: linux/amd64

variables:
  - &plur_image "registry.shark-tet.ts.net/plur/ci:2026-10-20-d7ba966f"

steps:
  - name: codspeed
    image: *plur_image
    volumes:
      - ci-bench:/bench
    environment:
      CI: "true"
      BUNDLE_JOBS: "4"
      BUNDLE_RETRY: "3"
      # plur's own build/bundle caches stay on the shared /cache volume (fast builds)
      BUNDLE_PATH: /cache/plur/bundle
      GOPATH: /cache/plur/go
      GOCACHE: /cache/plur/go-build
      XDG_CACHE_HOME: /cache/plur/xdg
      BENCH_ROOT: /bench/plur-codspeed
      # renovate: datasource=github-releases depName=CodSpeedHQ/codspeed
      CODSPEED_VERSION: 5.4.2
      CODSPEED_TOKEN:
        from_secret: codspeed_token
    commands:
      - |
        set -e

        tool_tmp="$PWD/tmp/bench-tools"
        mkdir -p "$BUNDLE_PATH" "$GOPATH/bin" "$GOCACHE" "$XDG_CACHE_HOME" "$BENCH_ROOT" "$tool_tmp"
        # Install into mise's Go bin directory and prefer it over cached binaries.
        GOBIN="$(mise where go)/bin"
        export GOBIN
        export PATH="$GOBIN:/opt/mise/shims:$GOPATH/bin:/usr/local/bin:$PATH"

        go version
        ruby --version
        goreleaser --version

        # Cached in $GOPATH/bin, re-fetched on a version bump. `install` (not the
        # installer's mv) gives the cached copy the volume's shared SELinux label.
        if ! "$GOPATH/bin/codspeed" --version 2>/dev/null | grep -qF "$CODSPEED_VERSION"; then
          curl -fsSL "https://codspeed.io/v$CODSPEED_VERSION/install.sh" | CODSPEED_RUNNER_UNMANAGED_INSTALL="$tool_tmp" sh
          install "$tool_tmp/codspeed" "$GOPATH/bin/codspeed"
        fi
        codspeed --version

        bundle install --jobs "$BUNDLE_JOBS" --retry "$BUNDLE_RETRY"
        bin/rake vendor:download:current
        bin/rake install

        # rubocop and rack have specs that fail under root.
        id -u bench >/dev/null 2>&1 || useradd --create-home --shell /bin/bash bench
        chown -R bench:bench "$PWD" "$BENCH_ROOT"

        # XDG_CACHE_HOME is for root's build caches; rubocop's specs expect the default.
        runuser -u bench -- env -u XDG_CACHE_HOME PATH="$PATH" HOME=/home/bench CI=true \
          script/bench-suite --manifest benchmarks/projects.yml --out "$BENCH_ROOT" --provision-only

        # Targets use plur's Ruby (not a mise shim) and their own vendor/bundle.
        # BUILDKITE_* make CodSpeed record a push run on this branch, as it has no
        # Crow provider. --skip-setup avoids sudo; exec-harness lands in ~/.cargo/bin.
        runuser -u bench -- env -u XDG_CACHE_HOME -u BUNDLE_PATH PATH="$(mise where ruby)/bin:/home/bench/.cargo/bin:$PATH" HOME=/home/bench CI=true \
          CODSPEED_TOKEN="$CODSPEED_TOKEN" CODSPEED_ISOLATION=false CODSPEED_PROFILER_ENABLED=false \
          BUILDKITE=true BUILDKITE_REPO=https://github.com/rsanheim/plur.git BUILDKITE_BRANCH="$CI_COMMIT_BRANCH" BUILDKITE_PULL_REQUEST=false \
          codspeed run --skip-setup -m walltime --config benchmarks/codspeed.yml
